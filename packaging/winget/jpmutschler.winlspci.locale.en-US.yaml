ShortDescription: lspci for Windows, without a kernel driver
Description: |-
  Reads Windows' own PnP/PCI enumeration for identity, class, bus:device.function,
  negotiated and maximum link speed and width, MPS/MRRS, driver binding, device
  type, capability presence, power state and topology -- and says plainly what it
  cannot report without a kernel driver (config-space dumps, capability contents).
  Requires Windows PowerShell 5.1, which ships with Windows.
